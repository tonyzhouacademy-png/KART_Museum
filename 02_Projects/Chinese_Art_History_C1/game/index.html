<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order of Jade and Stone｜纸上中洲阶段测验</title>
  <style>
    :root {
      --bg: #050505;
      --text: #8c9699;
      --mute: #505858;
      --line: #1a1a1a;
      --jade: #7a9e7e;
      --bronze: #b8860b;
      --clay: #a67c52;
      --highlight: #dcdcdc;
      --wong: #c99a2e;
      --bao: #b48658;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: "Noto Serif SC", "Songti SC", "Times New Roman", serif;
      user-select: none;
    }

    button,
    input,
    textarea { font: inherit; }

    .overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }

    .noise {
      opacity: .055;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .scanlines {
      opacity: .16;
      background: linear-gradient(to bottom, transparent, transparent 52%, rgba(0,0,0,.42) 53%);
      background-size: 100% 5px;
    }

    .field {
      position: fixed;
      inset: -20%;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 15%, rgba(122,158,126,.12), transparent 30%),
        radial-gradient(circle at 14% 78%, rgba(184,134,11,.08), transparent 24%),
        radial-gradient(circle at 84% 76%, rgba(166,124,82,.08), transparent 24%),
        #030303;
    }

    .field::before,
    .field::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .18;
      background:
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255,255,255,.026) 1px, transparent 1px);
      background-size: 88px 88px;
      transform: rotate(-2deg);
    }

    .field::after {
      opacity: .10;
      background-size: 144px 144px;
      transform: rotate(3deg) scale(1.08);
    }

    #start-screen,
    #name-screen,
    #ending-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: rgba(0,0,0,.96);
      transition: opacity 1s;
      text-align: center;
    }

    #start-screen { cursor: pointer; }

    #start-screen h1,
    #ending-screen h1 {
      margin: 0 0 10px;
      color: var(--highlight);
      font-size: clamp(1.7rem, 5vw, 3.8rem);
      line-height: 1.05;
      font-weight: 300;
      letter-spacing: 6px;
    }

    #start-screen .sub,
    #ending-screen .sub {
      color: var(--jade);
      font-size: 1rem;
      letter-spacing: 5px;
      opacity: .75;
    }

    #start-screen p {
      margin: 30px 0 0;
      color: #555;
      font-size: .8rem;
      letter-spacing: 3px;
      animation: pulse 2.4s infinite;
    }

    #name-screen {
      z-index: 110;
      opacity: 0;
      pointer-events: none;
    }

    #name-screen.show {
      opacity: 1;
      pointer-events: all;
    }

    .name-box,
    .modal-box {
      width: min(520px, 92vw);
      border: 1px solid #202020;
      background: rgba(5,5,5,.96);
      padding: 30px;
      box-shadow: 0 0 40px rgba(0,0,0,.55);
    }

    .name-deco {
      width: 42px;
      height: 1px;
      margin: 0 auto 24px;
      background: var(--jade);
      opacity: .45;
    }

    .name-prompt {
      margin-bottom: 8px;
      color: var(--text);
      font-size: .95rem;
      line-height: 1.85;
    }

    .name-sub {
      margin-bottom: 22px;
      color: #555;
      font-size: .78rem;
      letter-spacing: 1px;
    }

    input,
    textarea {
      width: 100%;
      outline: none;
      border: 1px solid #333;
      background: rgba(0,0,0,.72);
      color: var(--highlight);
      padding: 12px 14px;
      text-align: center;
      line-height: 1.6;
    }

    textarea {
      min-height: 96px;
      text-align: left;
      resize: none;
    }

    input:focus,
    textarea:focus { border-color: var(--jade); }

    .tiny-btn,
    .choice,
    .modal-btn {
      border: 1px solid #262626;
      background: rgba(0,0,0,.46);
      color: var(--text);
      cursor: pointer;
      transition: border-color .35s, color .35s, background .35s, transform .35s;
    }

    .tiny-btn {
      min-height: 40px;
      margin-top: 14px;
      padding: 0 24px;
      color: var(--jade);
      border-color: rgba(122,158,126,.5);
      letter-spacing: 2px;
      font-size: .82rem;
    }

    .tiny-btn:hover,
    .modal-btn:hover {
      color: var(--jade);
      border-color: var(--jade);
      background: rgba(122,158,126,.08);
    }

    .skip {
      display: block;
      margin-top: 14px;
      color: #3c3c3c;
      cursor: pointer;
      font-size: .72rem;
      letter-spacing: 1px;
    }

    .skip:hover { color: #666; }

    #wrap {
      position: relative;
      z-index: 10;
      width: min(680px, 90vw);
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #main-game {
      width: 100%;
      padding: 48px 0;
      transition: opacity 1s;
    }

    #stage {
      width: clamp(148px, 25vw, 190px);
      height: clamp(148px, 25vw, 190px);
      margin: 0 auto 28px;
      filter: drop-shadow(0 0 15px rgba(122,158,126,.28));
      transition: filter 1s;
    }

    #shape {
      stroke-dasharray: 540;
      stroke-dashoffset: 540;
      animation: drawPath 2.2s forwards ease-in-out;
    }

    #phase-indicator {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      color: var(--mute);
      font-family: Arial, sans-serif;
      font-size: .68rem;
      letter-spacing: 3px;
      opacity: .55;
    }

    #phase-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 9px;
      border-radius: 50%;
      background: var(--jade);
      vertical-align: middle;
    }

    #text-area {
      min-height: 176px;
      margin-bottom: 22px;
      color: var(--text);
      line-height: 1.95;
      font-size: clamp(1rem, 1.9vw, 1.16rem);
      opacity: 0;
    }

    #text-area b {
      color: var(--highlight);
      font-weight: 400;
      border-bottom: 1px solid rgba(122,158,126,.45);
    }

    #text-area i {
      color: var(--clay);
      font-style: normal;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0;
    }

    .choice {
      position: relative;
      width: 100%;
      min-height: 58px;
      padding: 13px 16px;
      text-align: left;
      font-size: .96rem;
      line-height: 1.65;
      overflow: hidden;
    }

    .choice:hover {
      border-color: var(--jade);
      color: var(--jade);
      background: rgba(122,158,126,.055);
      transform: translateX(4px);
    }

    .choice::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: var(--jade);
      transition: width .3s;
    }

    .choice:hover::before { width: 3px; }

    .oracle,
    .hidden-item {
      min-height: 22px;
      margin: 16px 0;
      color: var(--jade);
      font-size: .78rem;
      letter-spacing: 2px;
      opacity: 0;
      transition: opacity .8s;
    }

    .hidden-item { color: var(--clay); }
    .oracle.visible,
    .hidden-item.visible { opacity: .72; }

    .inventory {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(10, minmax(18px, 1fr));
      gap: 7px;
      width: min(560px, calc(100vw - 32px));
      transform: translateX(-50%);
    }

    .inv-item {
      height: 25px;
      display: grid;
      place-items: center;
      border: 1px solid #151515;
      color: #272727;
      background: rgba(0,0,0,.34);
      font-family: Arial, sans-serif;
      font-size: .62rem;
      transition: color .45s, border-color .45s, box-shadow .45s;
    }

    .inv-item.found {
      color: var(--bronze);
      border-color: rgba(184,134,11,.5);
      box-shadow: 0 0 10px rgba(184,134,11,.12);
    }

    #observer-panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 150;
      max-height: 72vh;
      overflow-y: auto;
      transform: translateY(100%);
      border-top: 1px solid var(--line);
      background: rgba(4,4,4,.98);
      padding: 24px 28px 20px;
      transition: transform .62s cubic-bezier(.16,1,.3,1);
    }

    #observer-panel.visible { transform: translateY(0); }

    .observer-header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
      color: #333;
      font-family: Arial, sans-serif;
      font-size: .62rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .observer-entry {
      max-width: 920px;
      margin: 0 auto 16px;
      padding-left: 13px;
      border-left: 2px solid #222;
    }

    .observer-name {
      margin-bottom: 6px;
      font-family: Arial, sans-serif;
      font-size: .68rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .observer-text {
      color: #aaa;
      font-size: .92rem;
      line-height: 1.85;
      font-style: italic;
    }

    .entry-tony .observer-name { color: var(--jade); }
    .entry-wong .observer-name { color: var(--wong); }
    .entry-bao .observer-name { color: var(--bao); }
    .entry-tony { border-left-color: rgba(122,158,126,.32); }
    .entry-wong { border-left-color: rgba(201,154,46,.34); }
    .entry-bao { border-left-color: rgba(180,134,88,.36); }

    #observer-continue {
      float: right;
      min-height: 38px;
      padding: 0 24px;
      border: 1px solid #333;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: .74rem;
      letter-spacing: 2px;
    }

    #observer-continue:hover {
      color: var(--jade);
      border-color: var(--jade);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 210;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.88);
      opacity: 0;
      pointer-events: none;
      transition: opacity .5s;
    }

    .modal.show {
      opacity: 1;
      pointer-events: all;
    }

    .modal-label {
      margin-bottom: 18px;
      color: var(--jade);
      font-family: Arial, sans-serif;
      font-size: .66rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .modal-prompt {
      margin-bottom: 16px;
      color: #bbb;
      line-height: 1.9;
      text-align: left;
    }

    .modal-options {
      display: grid;
      gap: 10px;
      margin: 12px 0;
    }

    .modal-option {
      border: 1px solid #242424;
      background: rgba(0,0,0,.42);
      color: var(--text);
      padding: 12px 14px;
      text-align: left;
      line-height: 1.6;
      cursor: pointer;
      transition: border-color .3s, color .3s, background .3s;
    }

    .modal-option:hover,
    .modal-option.selected {
      color: var(--jade);
      border-color: rgba(122,158,126,.7);
      background: rgba(122,158,126,.07);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 12px;
    }

    .modal-btn {
      min-height: 38px;
      padding: 0 18px;
      font-family: Arial, sans-serif;
      font-size: .76rem;
      letter-spacing: 2px;
    }

    #ending-screen {
      display: none;
      overflow-y: auto;
      justify-content: flex-start;
      padding-top: 8vh;
    }

    #ending-screen.show {
      display: flex;
      animation: fadeIn 1.2s ease forwards;
    }

    .ending-card {
      width: min(680px, 92vw);
      padding-bottom: 44px;
    }

    .ending-desc {
      max-width: 560px;
      margin: 22px auto;
      color: var(--text);
      line-height: 1.9;
      font-size: 1rem;
    }

    .score-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 24px 0;
      flex-wrap: wrap;
      color: #555;
      font-family: Arial, sans-serif;
      font-size: .72rem;
      letter-spacing: 1px;
    }

    .score-item {
      min-width: 92px;
      text-align: center;
    }

    .score-bar {
      height: 4px;
      margin-top: 6px;
      background: #1d1d1d;
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      width: 0;
      background: var(--jade);
      transition: width 1.4s ease;
    }

    .record-card,
    .miss-list,
    .past-card {
      border: 1px solid #171717;
      background: rgba(122,158,126,.025);
      padding: 18px;
      margin-top: 18px;
      text-align: left;
      line-height: 1.8;
    }

    .record-title {
      margin-bottom: 12px;
      color: var(--bronze);
      font-family: Arial, sans-serif;
      font-size: .66rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .record-card b {
      color: var(--highlight);
      font-weight: 400;
    }

    .btn-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    @keyframes drawPath { to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: .22; } 50% { opacity: .68; } }

    @media (max-width: 620px) {
      body { overflow-y: auto; }
      #wrap { width: min(92vw, 680px); align-items: flex-start; padding-top: 76px; }
      #main-game { padding-bottom: 88px; }
      #text-area { min-height: auto; }
      .observer-header { display: block; }
      .inventory { grid-template-columns: repeat(6, minmax(18px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="field"></div>
  <div class="overlay noise"></div>
  <div class="overlay scanlines"></div>

  <div id="phase-indicator"><span id="phase-dot"></span><span id="phase-text">未入卷宗</span></div>

  <div id="start-screen">
    <h1>ORDER OF JADE &amp; STONE</h1>
    <div class="sub">纸上中洲阶段测验</div>
    <p>CLICK TO ENTER THE ARCHIVE / 点击进入卷宗</p>
  </div>

  <div id="name-screen">
    <div class="name-box">
      <div class="name-deco"></div>
      <div class="name-prompt">十课之后，档案室还亮着一盏灯。</div>
      <div class="name-sub">留下名字，或匿名进入。美丽与宝玉会在途中回应你。</div>
      <input id="name-input" maxlength="20" autocomplete="off" spellcheck="false" placeholder="你的名字">
      <button class="tiny-btn" id="name-submit">进入档案</button>
      <span class="skip" id="name-skip">匿名进入</span>
    </div>
  </div>

  <div id="wrap">
    <main id="main-game">
      <svg id="stage" viewBox="0 0 100 100" aria-hidden="true">
        <path id="shape" d="" fill="none" stroke="#555" stroke-width="1.15"/>
      </svg>
      <div id="text-area"></div>
      <div id="hidden-item" class="hidden-item"></div>
      <div id="choices" class="btn-container"></div>
      <div id="oracle" class="oracle"></div>
    </main>
  </div>

  <div class="inventory" id="inventory"></div>

  <aside id="observer-panel">
    <div class="observer-header">
      <span>THE OBSERVERS RESPOND</span>
      <span>美丽 / 宝玉 / Tony</span>
    </div>
    <div id="obs-tony" class="observer-entry entry-tony">
      <div class="observer-name">Tony Zhou — Meta Observer</div>
      <div class="observer-text" id="obs-tony-text"></div>
    </div>
    <div id="obs-wong" class="observer-entry entry-wong">
      <div class="observer-name">王美丽 — Value Reader</div>
      <div class="observer-text" id="obs-wong-text"></div>
    </div>
    <div id="obs-bao" class="observer-entry entry-bao">
      <div class="observer-name">宝玉 — Civilization Historian</div>
      <div class="observer-text" id="obs-bao-text"></div>
    </div>
    <div style="clear:both"></div>
    <button id="observer-continue">继续</button>
  </aside>

  <div id="note-modal" class="modal">
    <div class="modal-box">
      <div class="modal-label" id="modal-label"></div>
      <div class="modal-prompt" id="modal-prompt"></div>
      <div id="modal-options" class="modal-options"></div>
      <textarea id="modal-input" maxlength="220" spellcheck="false"></textarea>
      <div class="modal-actions">
        <button class="modal-btn" id="modal-skip">暂不留下</button>
        <button class="modal-btn" id="modal-submit">收入卷宗</button>
      </div>
    </div>
  </div>

  <section id="ending-screen">
    <div class="ending-card">
      <h1 id="ending-title">阶段卷宗</h1>
      <div class="sub" id="ending-sub">ARCHIVE OPENED</div>
      <p class="ending-desc" id="ending-desc"></p>
      <div class="score-row" id="score-row"></div>
      <div class="record-card" id="record-card"></div>
      <div class="miss-list" id="miss-list"></div>
      <div class="past-card" id="past-card"></div>
      <div class="btn-row">
        <button class="tiny-btn" id="restart-btn">重新进入</button>
      </div>
    </div>
  </section>

  <script>
    const HISTORY_KEY = "kart-c1-stage-archive-history";
    const SHAPES = {
      center: "M50 8 L78 24 L78 58 Q66 84 50 92 Q34 84 22 58 L22 24 Z M50 8 V92 M22 24 Q50 38 78 24",
      jade: "M50 9 L76 28 L76 62 L50 82 L24 62 L24 28 Z M50 28 A21 21 0 1 0 50 70 A21 21 0 1 0 50 28",
      ding: "M20 60 L20 42 L30 31 L70 31 L80 42 L80 60 L74 67 L26 67 Z M31 67 L29 82 M69 67 L71 82 M36 39 Q50 49 64 39",
      lacquer: "M18 66 C34 22 54 86 82 34 M20 52 C42 74 56 18 80 58 M30 76 Q48 62 70 76",
      bridge: "M14 68 Q50 18 86 68 M18 68 H82 M30 68 V82 M50 68 V82 M70 68 V82",
      buddha: "M50 14 Q66 16 70 32 Q86 42 82 62 Q80 78 50 86 Q20 78 18 62 Q14 42 30 32 Q34 16 50 14 Z M38 54 Q50 62 62 54 M36 40 Q42 36 48 40 M52 40 Q58 36 64 40",
      horse: "M18 64 L28 45 L48 42 L64 50 L78 48 L84 60 L72 62 L70 78 M34 52 L32 78 M54 53 L52 78 M42 40 L34 28 M48 42 L56 30",
      mountain: "M12 76 L34 38 L48 60 L62 28 L88 76 Z M34 38 L38 76 M62 28 L66 76",
      porcelain: "M34 18 Q50 10 66 18 Q62 26 58 36 Q72 48 68 72 Q62 86 50 88 Q38 86 32 72 Q28 48 42 36 Q38 26 34 18 Z M39 27 Q50 33 61 27",
      garden: "M18 78 C30 46 36 30 52 34 C66 38 64 58 82 54 M26 78 H84 M34 68 Q50 50 66 68 M22 46 Q34 34 46 46 M54 38 Q68 24 80 38",
      qing: "M22 70 Q36 34 56 58 Q70 76 84 38 M18 82 C44 74 58 74 82 82 M32 32 Q48 20 64 32 M42 20 Q50 12 58 20"
    };

    const lessons = [
      {
        phase: "01 / 纸上中洲",
        title: "总论：档案室的门",
        shape: "center",
        color: "#7a9e7e",
        fragment: "方法",
        text: "你走进一间没有窗的档案室。墙上没有朝代表，只有十只空格。<br><br>Tony 在桌边放下一张纸：<b>艺术史不是把作品排成队，而是训练一种判断。</b><br><br>第一只空格问你：你会先从哪一道门进入艺术史？",
        choices: [
          {
            text: "先问人的处境：一件作品怎样改写恐惧、欲望、时间和价值？",
            route: "价值感",
            a: 3,
            i: 1,
            echo: {
              tony: "这条路最接近美丽。它会让图像活起来，但后面要记得给感受找证据。",
              wong: "我会先听作品里的时间。看它让人变慢、变急，还是突然有了方向。",
              bao: "人的处境很重要。只是别忘了：处境常常被制度和材料夹住。"
            }
          },
          {
            text: "先问秩序：这件东西被谁制造、为谁保存、替谁证明权力？",
            route: "秩序感",
            r: 3,
            e: 1,
            echo: {
              tony: "这是宝玉的入口。它能把作品从漂亮物件里救出来，放回制度现场。",
              wong: "秩序不是冷冰冰的。它会进入人的身体，规定什么被看见，什么被压住。",
              bao: "对。先找位置，再读形象。没有位置，判断容易飘。"
            }
          },
          {
            text: "先问证据：图像、题记、墓葬、器物和文献之间怎样互相作证？",
            route: "证据钉子",

        text: "离开第十室前，写一句阶段札记：如果以后继续学中国艺术史，你最想补哪一类证据或哪一种人的处境？",
        key: "final",
        placeholder: "例如：我想补清代宫廷观看如何改变遗民画家的处境。"
      }
    };

    let pendingNav = null;
    let playerName = "";
    const $ = id => document.getElementById(id);
    const shape = $("shape");
    const choices = $("choices");
    const textArea = $("text-area");
    const hiddenItem = $("hidden-item");
    const oracle = $("oracle");
    let audioCtx, droneOsc, droneGain, windNoise, windFilter, windGain, ambientTimer;

    function initAudio() {
      if (audioCtx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      droneOsc = audioCtx.createOscillator();
      droneGain = audioCtx.createGain();
      droneOsc.type = "triangle";
      droneOsc.frequency.value = 39;
      droneGain.gain.value = 0.018;
      droneOsc.connect(droneGain).connect(audioCtx.destination);
      droneOsc.start();

      const bufferSize = 2 * audioCtx.sampleRate;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i += 1) data[i] = Math.random() * 2 - 1;
      windNoise = audioCtx.createBufferSource();
      windNoise.buffer = noiseBuffer;
      windNoise.loop = true;
      windFilter = audioCtx.createBiquadFilter();
      windFilter.type = "lowpass";
      windFilter.frequency.value = 150;
      windGain = audioCtx.createGain();
      windGain.gain.value = 0.009;
      windNoise.connect(windFilter).connect(windGain).connect(audioCtx.destination);
      windNoise.start();
      ambientTimer = setInterval(() => {
        if (Math.random() > 0.64) playChime();
      }, 4200);
    }

    function playChime(freq) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq || (590 + Math.random() * 340);
      gain.gain.setValueAtTime(0.065, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.7);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 1.7);
    }

    function playLowKnock() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.value = 118;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.45);
    }

    function setShape(key, color) {
      shape.setAttribute("d", SHAPES[key] || SHAPES.center);
      shape.setAttribute("stroke", color || "#555");
      shape.style.strokeDashoffset = "540";
      shape.style.animation = "none";
      requestAnimationFrame(() => { shape.style.animation = "drawPath 2.2s forwards ease-in-out"; });
      $("stage").style.filter = `drop-shadow(0 0 16px ${color || "#7a9e7e"}44)`;
      $("phase-dot").style.background = color || "#7a9e7e";
    }

    function refresh(el, delay) {
      el.style.transition = "none";
      el.style.opacity = "0";
      void el.offsetWidth;
      setTimeout(() => {
        el.style.transition = "opacity .9s ease";
        el.style.opacity = "1";
      }, delay);
    }

    function renderInventory() {
      $("inventory").innerHTML = lessons.map((lesson, idx) => {
        const found = game.fragments.includes(lesson.fragment);
        return `<div class="inv-item ${found ? "found" : ""}" title="${lesson.title}">${idx + 1}</div>`;
      }).join("");
    }

    function renderScene() {
      const scene = lessons[game.index];
      $("phase-text").textContent = scene.phase;
      setShape(scene.shape, scene.color);
      textArea.innerHTML = scene.text;
      refresh(textArea, 220);
      hiddenItem.classList.remove("visible");
      hiddenItem.textContent = "";
      oracle.classList.add("visible");
      oracle.textContent = "“不要急着回答。先让物把你看一会儿。”";
      choices.innerHTML = "";
      scene.choices.forEach((choice, idx) => {
        const button = document.createElement("button");
        button.className = "choice";
        button.innerHTML = choice.text;
        button.addEventListener("click", () => choose(idx));
        choices.appendChild(button);
      });
      refresh(choices, 680);
      renderInventory();
    }

    function choose(idx) {
      const scene = lessons[game.index];
      const choice = scene.choices[idx];
      choices.querySelectorAll("button").forEach(button => button.disabled = true);
      addAxes(choice);
      game.completed += 1;
      game.routes.push({
        phase: scene.phase,
        title: scene.title,
        route: choice.route || "未命名路径",
        text: choice.text
      });
      collect(scene.fragment, choice.route);
      const goNext = () => {
        if (scene.challenge) showChallenge(scene.challenge, advance);
        else advance();
      };
      showObservers(choice.echo || scene.npcs || {}, goNext);
    }

    function addAxes(source) {
      game.meili += source.a || 0;
      game.baoyu += source.r || 0;
      game.evidence += source.e || 0;
      game.wonder += source.i || 0;
    }

    function collect(fragment, route) {
      if (!game.fragments.includes(fragment)) game.fragments.push(fragment);
      playChime(520 + game.index * 24);
      hiddenItem.textContent = "◈ 档案碎片收入：" + fragment + (route ? " / 路径：" + route : "");
      hiddenItem.classList.add("visible");
      renderInventory();
    }

    function showObservers(npcs, callback) {
      const map = [
        ["tony", "obs-tony", "obs-tony-text"],
        ["wong", "obs-wong", "obs-wong-text"],
        ["bao", "obs-bao", "obs-bao-text"]
      ];
      map.forEach(([key, box, text]) => {
        if (npcs && npcs[key]) {
          $(box).style.display = "block";
          $(text).innerHTML = npcs[key];
        } else {
          $(box).style.display = "none";
          $(text).innerHTML = "";
        }
      });
      pendingNav = callback;
      $("observer-panel").classList.add("visible");
    }

    function showChallenge(type, callback) {
      const data = CHALLENGES[type];
      if (!data) {
        callback();
        return;
      }
      const modalOptions = $("modal-options");
      const input = $("modal-input");
      const submit = $("modal-submit");
      const selected = [];
      $("modal-label").textContent = data.label;
      $("modal-prompt").innerHTML = data.text;
      input.value = "";
      input.placeholder = data.placeholder || "";
      modalOptions.innerHTML = "";
      input.style.display = data.mode === "text" ? "block" : "none";
      modalOptions.style.display = data.mode === "pick" ? "grid" : "none";
      submit.textContent = data.mode === "pick" ? "收入选择" : "收入卷宗";
      if (data.mode === "pick") {
        data.options.forEach(option => {
          const button = document.createElement("button");
          button.className = "modal-option";
          button.type = "button";
          button.textContent = option.text;
          button.addEventListener("click", () => {
            const found = selected.indexOf(option);
            if (found >= 0) {
              selected.splice(found, 1);
              button.classList.remove("selected");
              return;
            }
            if (selected.length >= data.max) {
              playLowKnock();
              return;
            }
            selected.push(option);
            button.classList.add("selected");
            playChime(680 + selected.length * 80);
          });
          modalOptions.appendChild(button);
        });
      }
      $("note-modal").classList.add("show");
      submit.onclick = () => {
        if (data.mode === "pick") {
          const label = selected.map(item => item.text).join(" + ");
          selected.forEach(addAxes);
          if (label && Array.isArray(game.notes[data.key])) game.notes[data.key].push(label);
        } else {
          const value = input.value.trim();
          if (value) game.notes[data.key] = value;
        }
        $("note-modal").classList.remove("show");
        setTimeout(callback, 260);
      };
      $("modal-skip").onclick = () => {
        playLowKnock();
        $("note-modal").classList.remove("show");
        setTimeout(callback, 260);
      };
      if (data.mode === "text") setTimeout(() => input.focus(), 120);
    }

    function advance() {
      if (game.index < lessons.length - 1) {
        game.index += 1;
        renderScene();
      } else {
        showEnding();
      }
    }

    function axisScores() {
      return AXES.map(([key, label, keeper]) => ({
        key,
        label,
        keeper,
        value: game[key]
      })).sort((a, b) => b.value - a.value);
    }

    function endingType() {
      const ranked = axisScores();
      const top = ranked[0];
      const spread = top.value - ranked[ranked.length - 1].value;
      if (spread <= 2) {
        return {
          title: "阶段策展人",
          sub: "STAGE ARCHIVE / BALANCED",
          desc: "你的十课路径比较均衡：既听见作品里的生命处境，也会回头找制度、史料和那些不肯被驯化的异质光。下一阶段可以把每个判断都配上一件更精确的图文证据。"
        };
      }
      const endings = {
        meili: {
          title: "价值听见者",
          sub: "MEILI'S CLOCK",
          desc: "你更接近美丽这一轴：会先问作品怎样改变人的时间感、生活感和价值感。下一阶段要把这些感受更多落到器物、题记、制度和具体历史事例上。"
        },
        baoyu: {
          title: "秩序读档人",
          sub: "BAOYU'S INSCRIPTION",
          desc: "你更接近宝玉这一轴：会先看材料、身份、礼制、皇权和观看位置。下一阶段要让结构判断继续保留人的处境、痛感和生命气息。"
        },
        evidence: {
          title: "史事钉子手",
          sub: "EVIDENCE KEEPER",
          desc: "你会优先找图、文、器物、出土位置和具体事件来支撑判断。下一阶段可以让证据不只证明观点，也显出其中人的冒险、犹豫和戏剧性。"
        },
        wonder: {
          title: "异境采集者",
          sub: "STRANGE LIGHT COLLECTOR",
          desc: "你会被玉、烟、魂、佛身、胡乐、青花和西洋光吸引。下一阶段要把这种光怪陆离的直觉，安放到更清楚的时代结构和史料钉子里。"
        }
      };
      return endings[top.key];
    }

    function showEnding() {
      const end = endingType();
      playChime(430);
      $("main-game").style.opacity = "0";
      setTimeout(() => {
        playChime(640);
        $("wrap").style.display = "none";
        $("phase-indicator").style.display = "none";
        $("inventory").style.display = "none";
        $("ending-title").textContent = end.title;
        $("ending-sub").textContent = end.sub;
        $("ending-desc").textContent = end.desc;
        buildScores();
        buildRecord(end.title);
        buildMissList();
        saveHistory(end.title);
        buildPast();
        $("ending-screen").style.display = "flex";
        $("ending-screen").classList.add("show");
      }, 900);
    }

    function buildScores() {
      const stats = [
        ["完成", game.completed + "/10", game.completed / 10],
        ["价值感", game.meili, Math.min(1, game.meili / 16)],
        ["秩序感", game.baoyu, Math.min(1, game.baoyu / 16)],
        ["证据", game.evidence, Math.min(1, game.evidence / 14)],
        ["异质", game.wonder, Math.min(1, game.wonder / 14)]
      ];
      $("score-row").innerHTML = stats.map(([label, value, ratio]) => `
        <div class="score-item">
          <div>${label}: ${value}</div>
          <div class="score-bar"><div class="score-fill" style="width:${Math.round(ratio * 100)}%"></div></div>
        </div>
      `).join("");
    }

    function buildRecord(title) {
      const name = playerName || "匿名旅人";
      const noteValue = value => {
        if (Array.isArray(value)) return value.length ? value.join(" / ") : "暂未记录";
        return value || "暂未记录";
      };
      const routeText = game.routes.map(item => `${item.phase.slice(0, 2)}:${item.route}`).join(" / ");
      const noteRows = [
        ["十课路径", routeText || "未形成"],
        ["玉印与小机关", noteValue(game.notes.seals.concat(game.notes.pairings))],
        ["青铜铭文", noteValue(game.notes.inscription)],
        ["阶段札记", noteValue(game.notes.final)]
      ];
      $("record-card").innerHTML = `
        <div class="record-title">JADE RECORD / 阶段卷宗</div>
        <div><b>${escapeHtml(name)}</b> 的档案类型：${title}</div>
        <div>收入碎片：${game.fragments.length ? game.fragments.join("、") : "无"}</div>
        ${noteRows.map(([k, v]) => `<div>${k}：${escapeHtml(v)}</div>`).join("")}
      `;
    }

    function buildMissList() {
      const ranked = axisScores();
      const strongest = ranked[0];
      const quiet = ranked.filter(item => strongest.value - item.value >= 4);
      const routeRows = game.routes.map(item => `<div>${escapeHtml(item.phase)}｜${escapeHtml(item.title)}｜${escapeHtml(item.route)}</div>`).join("");
      const next = quiet.length
        ? `下一阶段可补：${quiet.map(item => item.label).join("、")}。`
        : "四条线没有明显短板。下一阶段可以直接把每一课的选择配上更精确的图、文材料。";
      $("miss-list").innerHTML = `
        <div class="record-title">ROUTE MAP / 十课路径</div>
        ${routeRows}
        <div style="margin-top:12px;color:#777">${escapeHtml(next)}</div>
      `;
    }

    function saveHistory(title) {
      const item = {
        name: playerName || "匿名旅人",
        title,
        path: axisScores()[0].label,
        completed: game.completed,
        fragments: game.fragments.length,
        time: new Date().toLocaleString("zh-CN")
      };
      let history = [];
      try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); } catch (e) { history = []; }
      history.unshift(item);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, 5)));
    }

    function buildPast() {
      let history = [];
      try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); } catch (e) { history = []; }
      const past = history.slice(1, 4);
      if (!past.length) {
        $("past-card").innerHTML = `<div class="record-title">PAST TRAVELLERS</div>这台设备上还没有更早的卷宗记录。`;
        return;
      }
      $("past-card").innerHTML = `
        <div class="record-title">PAST TRAVELLERS / 过往卷宗</div>
        ${past.map(item => `<div>${escapeHtml(item.time)}｜${escapeHtml(item.name)}｜${escapeHtml(item.title)}｜${escapeHtml(item.path || "过往路径")}｜${item.completed || item.score || 0}/10｜碎片 ${item.fragments}/10</div>`).join("")}
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function enterName() {
      playerName = $("name-input").value.trim();
      $("name-screen").classList.remove("show");
      setTimeout(renderScene, 260);
    }

    function restart() {
      game.index = 0;
      game.completed = 0;
      game.meili = 0;
      game.baoyu = 0;
      game.evidence = 0;
      game.wonder = 0;
      game.fragments = [];
      game.routes = [];
      game.notes = { seals: [], inscription: "", pairings: [], final: "" };
      $("ending-screen").classList.remove("show");
      $("ending-screen").style.display = "none";
      $("wrap").style.display = "flex";
      $("inventory").style.display = "grid";
      $("phase-indicator").style.display = "block";
      $("main-game").style.opacity = "1";
      renderScene();
    }

    $("observer-continue").addEventListener("click", () => {
      $("observer-panel").classList.remove("visible");
      const next = pendingNav;
      pendingNav = null;
      if (next) setTimeout(next, 260);
    });

    $("start-screen").addEventListener("click", () => {
      initAudio();
      playChime(720);
      $("start-screen").style.opacity = "0";
      setTimeout(() => {
        $("start-screen").style.display = "none";
        $("name-screen").classList.add("show");
        setTimeout(() => $("name-input").focus(), 100);
      }, 900);
    });

    $("name-submit").addEventListener("click", enterName);
    $("name-skip").addEventListener("click", () => {
      playerName = "";
      $("name-screen").classList.remove("show");
      setTimeout(renderScene, 260);
    });
    $("name-input").addEventListener("keydown", event => {
      if (event.key === "Enter") enterName();
    });
    $("restart-btn").addEventListener("click", restart);
    renderInventory();
  </script>
</body>
</html>
